<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2a1338"><title>Barkada After Dark 🎭</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f9f0ff;background:#160f22}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#412046,#160f22 65%);min-height:100vh}main{max-width:560px;padding:20px 16px 80px;margin:auto}.hero{background:linear-gradient(135deg,#512052,#9b3864);padding:24px;border-radius:26px;margin:12px 0 18px;box-shadow:0 12px 35px #0004}.hero h1{font-size:35px;line-height:1.02;margin:8px 0;font-weight:950}.hero p{color:#f4c9e3}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:850;color:#f7c6dc}.panel{background:#2d2038;border:1px solid #624763;border-radius:19px;padding:17px;margin:12px 0}.card{background:linear-gradient(145deg,#4d254d,#241932);border:1px solid #83577f;padding:23px;border-radius:20px;min-height:160px;display:flex;flex-direction:column;justify-content:space-between;gap:17px;margin:10px 0}.card strong{font-size:23px;line-height:1.25}.btn{border:0;border-radius:13px;padding:13px 15px;min-height:45px;background:#f072ae;color:#25142c;font-weight:850;font-size:14px;cursor:pointer}.btn.ghost{background:#4a3555;color:#fdf1ff}.btn.full{width:100%}.btn:disabled{opacity:.45}input,textarea{width:100%;color:#fff;background:#1e1627;border:1px solid #725879;border-radius:13px;padding:13px;min-height:45px;font:inherit}textarea{height:100px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.stack{display:grid;gap:10px}.mode,.choice{width:100%;text-align:left;border:1px solid #76517b;background:#392844;color:#fff;padding:15px;border-radius:14px;font:inherit;cursor:pointer}.mode strong{font-size:15px}.choice.active{outline:2px solid #f072ae;background:#60355e}.muted{font-size:13px;color:#d5bbd6;line-height:1.5}.tiny{font-size:11px;color:#dcb9d7}.title{font-size:21px;font-weight:850}.pill{background:#59405f;padding:6px 10px;border-radius:100px;font-size:11px}.score{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #594561}.score:last-child{border:0}.hidden{display:none}.notice{padding:10px;background:#5b2b4c;border-radius:10px;margin:10px 0;color:#fff}.emoji{font-size:27px;margin-right:10px}</style>
<div style="max-width:560px;margin:14px auto 0;padding:0 16px"><a href="/host.html" style="display:block;background:#e971af;color:#201228;border-radius:14px;padding:15px;font:800 15px system-ui;text-align:center;text-decoration:none">🎤 Game Master Mode — One Phone, Everyone Answers →</a></div><main id="app"></main><script>
const modes=[['liar',"Who's the Liar?",'🤥','One player invents a lie. Everyone investigates.'],['confessions','Anonymous Confessions','💌','Real secrets, anonymous until the reveal.'],['cards','Unhinged Cards','🃏','Choose the funniest answer card.'],['court','Red Flag Court','🚩','Put a friend on trial.'],['impostor','The Impostor','🕵️','One person never got the secret word.'],['exposed','Exposed!','👀','Who fits this ridiculous scenario?']];
const $=document.getElementById('app');let socket,me='',state=null,privateData=null,selected='',name='',code='',localMode=false,localPlayers=[],localRound=0,localScores={},localPrompt='',localSecret=0,localStep=0,localPhase='home',localVotes=[],localSubmissions=[],localJudge=0,localAccused=0,localOffered=[],localUsed={};
const promptBank={liar:["Have you ever pretended you're on the way while still in bed?","Have you ever snooped through someone's following list?","Have you ever sent chismis to the wrong person?","Have you ever lied to avoid a gala?","Have you ever secretly disliked a friend's gift?"],impostor:["JOLLIBEE","MILK TEA","KARAOKE","SAMGYUPSAL","CHISMIS","BORACAY","PICKLEBALL","ZOMBIE","AIRPORT","GCASH","ROAD TRIP"],confessions:["What is your most embarrassing crush story?","What's the pettiest reason you stopped liking someone?","What's your most sabaw moment?","What's your funniest secret habit?"],cards:["The group chat went silent because _____.","The worst thing to say on a first date is _____.","My love language is _____.","Our group's biggest talent is _____.","When zombies arrive I'm bringing _____."],court:["The accused always says five minutes away while still at home.","The accused orders the most expensive meal and asks for equal split.","The accused screenshots private messages for the group chat.","The accused spoils a movie 'by accident'."],exposed:["Who would marry rich and forget us?","Who would accidentally reveal a surprise party?","Who would get lost with Google Maps open?","Who would survive zombies by sacrificing their boyfriend?","Who would befriend a hotel ghost?"]};
const bank=["a suspicious milk tea receipt","the ghost of unpaid ambagan","a PowerPoint about my ex","an emotional support rice cooker","a 47-minute voice note","three drops of delusion","unlimited chismis insurance","a portable bidet","the tears of the group treasurer","my ex's last apology","a karaoke mic","a missing charger","emotional support fries","an aggressively judgmental tita","the least athletic friend","certified fake alibis"];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),button=(s,f='go',klass='')=>'<button class="btn '+klass+'" data-action="'+f+'">'+s+'</button>',panel=(s)=>'<div class="panel">'+s+'</div>',card=(tag,q)=>'<div class="card"><span class="eyebrow">'+esc(tag)+'</span><strong>'+esc(q)+'</strong><span class="tiny">BARKADA AFTER DARK ✦</span></div>',shuffle=a=>[...a].sort(()=>Math.random()-.5),pick=a=>a[Math.floor(Math.random()*a.length)],modeName=()=>modes.find(x=>x[0]===selected)?.[1],menu=()=>'<div class="row between" style="margin-bottom:15px">'+button('⌂ Home','home','ghost')+'<span class="tiny">'+esc(modeName()||'BARKADA AFTER DARK')+'</span>'+button('🏆 Scores','scores','ghost')+'</div>';
function page(s){$.innerHTML=s}function connect(){socket=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){me=m.id;code=m.code;}if(m.type==='state'){state=m;render()}if(m.type==='private'){privateData=m;render()}if(m.type==='error'){alert(m.message)}};socket.onclose=()=>{if(!localMode)page(panel('Connection closed. Reload the page to join again.')+button('Reload','reload','full'))}}
function home(){page('<div class="hero"><div class="eyebrow">✦ THE AFTER HOURS EDITION</div><h1>BARKADA<br>AFTER DARK 🎭</h1><p>Six chaotic modes. One unforgettable game night.</p><span class="pill">🌶️ Taglish · 🤥 Bluffing · 🏆 Points</span></div>'+panel('<div class="title">Choose how to play</div><p class="muted">Everyone together on one phone, or each player joins a private multiplayer room.</p><div class="stack">'+button('📱 One Phone — with Game Master','localSetup','full')+button('🌐 Multiple Phones — Create Room','newRoom','full')+button('🔑 Join Friends by Room Code','joinRoom','ghost full')+'</div>'))}
function credentials(action){page(menu()+panel('<div class="title">'+(action==='create'?'Create room':'Join room')+'</div><p class="muted">Players join on separate phones using the room code. No account needed.</p><input id="nickname" maxlength="24" placeholder="Your nickname" autocomplete="off">'+(action==='join'?'<input id="roomcode" style="margin-top:9px" placeholder="Room code" autocomplete="off">':'')+'<div style="margin-top:12px">'+button(action==='create'?'Create room':'Join room','connect'+action,'full')+'</div>'))}
function render(){if(!state)return;const host=state.host===me,players=state.players;let s=menu()+panel('<div class="row between"><div><span class="tiny">YOUR ROOM CODE</span><div class="title" style="font-size:29px;letter-spacing:3px">'+esc(state.code)+'</div></div>'+button('Copy Code','copy','ghost')+'</div><p class="muted">Share '+esc(location.origin)+' and this code. '+players.length+' player(s) joined.</p><div class="stack">'+players.map(p=>'<div class="score"><span>'+(p.online?'🟢 ':'⚪ ')+esc(p.name)+(p.id===state.host?' 👑':'')+'</span><b>'+p.score+' pts</b></div>').join('')+'</div>');
if(state.phase==='lobby'){s+=panel('<div class="title">Choose a mode</div><div class="stack" style="margin-top:12px">'+modes.map(m=>'<button class="mode" data-mode="'+m[0]+'" '+(!host?'disabled':'')+'><span class="emoji">'+m[2]+'</span><strong>'+esc(m[1])+'</strong></button>').join('')+'</div><p class="muted">'+(host?'You are host. Pick a mode, then start when 3+ players join.':'The host chooses the mode.')+'</p>'+(state.mode?'<p>Selected: <b>'+esc(modes.find(m=>m[0]===state.mode)?.[1])+'</b></p>':'')+(host?button('▶ Start Round','start','full'):'')+'</div>')}
if(state.phase==='playing'){let current=state.mode,allowed=current==='court'?players.filter(p=>p.id!==state.accused):current==='cards'?players.filter(p=>p.id!==state.judge):players;const eligible=allowed.some(p=>p.id===me);s+=card('ROUND '+state.round+' · '+current.toUpperCase(),current==='impostor'?'Give clues about the secret word without saying it.':state.prompt);
s+=panel('<p class="muted">Submitted: '+state.submitted+'/'+state.needed+'</p>'+(privateData?.role?'<div class="notice">🔒 '+esc(privateData.role)+'</div>':'')+(current==='liar'||current==='impostor'?'<p class="muted">Discuss aloud, then secretly accuse one player.</p>':current==='court'?'<p class="muted">Accused: <b>'+esc(players.find(p=>p.id===state.accused)?.name)+'</b>. They defend themselves before voting.</p>':current==='cards'?'<p class="muted">Judge: '+esc(players.find(p=>p.id===state.judge)?.name)+'</p>':'')+(eligible?inputFor(current,players,allowed):'<p class="muted">You are sitting out this round. Wait for everyone to submit.</p>')+'</div>')}
if(state.phase==='judge'){s+=card('JUDGE PICK',state.prompt);s+=panel('<div class="title">Choose the funniest card</div>'+((state.judge===me)?'<div class="stack" style="margin-top:10px">'+(state.answers||[]).map((x,i)=>'<button class="choice" data-judge="'+i+'">'+esc(x.answer)+'</button>').join('')+'</div>':'<p class="muted">Waiting for the judge to pick the winner...</p>'))}
if(state.phase==='results'){const r=state.results||{};s+=card('THE REVEAL 🎭',r.winner||'Round complete');if(r.secret)s+=panel('Secret word: <b>'+esc(r.secret)+'</b>');s+=panel((r.reveals||[]).map(x=>'<div class="score"><b>'+esc(x.name)+'</b><span class="muted">'+esc(x.answer||x.vote)+'</span></div>').join(''));if(host)s+='<div class="stack">'+button('🔁 Next Round','start','full')+button('🎲 Choose a New Mode','lobby','ghost full')+'</div>'}
page(s)}
function inputFor(mode,players,allowed){let a='';if(['liar','impostor','exposed'].includes(mode)){a=players.map(p=>'<button class="choice" data-choice="'+esc(p.id)+'">'+esc(p.name)+'</button>').join('')}else if(mode==='court')a='<button class="choice" data-choice="innocent">😇 Not guilty</button><button class="choice" data-choice="guilty">🚩 Guilty</button>';else if(mode==='cards')a=(privateData?.cards||[]).map(x=>'<button class="choice" data-choice="'+esc(x)+'">'+esc(x)+'</button>').join('');else if(mode==='confessions')a='<textarea id="confession" maxlength="450" placeholder="Your funny true confession, no names..."></textarea>';return '<div class="stack">'+a+(mode==='confessions'?button('Submit Confession','submitText','full'):button('Lock in Answer','submit','full'))+'</div><p id="sent" class="muted"></p>'}
function localSetup(){page(menu()+panel('<div class="title">📱 Pass & Play</div><p class="muted">A human game master can read the prompts and direct the discussion aloud. Each player reads secret information privately before passing the phone.</p><textarea id="names" placeholder="Angie&#10;Josh&#10;Martin&#10;Monisha" style="height:170px"></textarea><p class="tiny">Enter at least 3 names, one per line.</p>'+button('Continue','localSave','full')))}
function localChoose(){page(menu()+'<div class="hero"><h1>PASS THE PHONE 📱</h1><p>'+localPlayers.length+' players ready. The game master can read public prompts out loud.</p></div><div class="stack">'+modes.map(m=>'<button class="mode" data-localmode="'+m[0]+'"><span class="emoji">'+m[2]+'</span><strong>'+m[1]+'</strong></button>').join('')+'</div>')}
function localStart(){localRound++;localStep=0;localVotes=[];localSubmissions=[];localSecret=Math.floor(Math.random()*localPlayers.length);localJudge=(localRound-1)%localPlayers.length;localAccused=(localRound-1)%localPlayers.length;localPrompt=pick(promptBank[selected]);localPhase='pass';localRender()}
function localRender(){let s=menu()+panel('<div class="row between"><b>Round '+localRound+'</b><span class="pill">'+esc(modeName())+'</span></div>');if(localPhase==='pass'){const who=localPlayers[localStep];s+=card('🔒 PRIVATE — PASS THE PHONE','Give the phone to '+who+'. No peeking!');s+=button('I am '+esc(who)+' — reveal','localReveal','full')}
if(localPhase==='reveal'){const who=localPlayers[localStep],bad=localStep===localSecret;let role='You are a player';if(selected==='liar')role=bad?'YOU ARE THE LIAR — invent an answer':'TELL THE TRUTH';if(selected==='impostor')role=bad?'YOU ARE THE IMPOSTOR — bluff!':'SECRET WORD: '+localPrompt;if(selected==='cards')role=localStep===localJudge?'YOU ARE THE JUDGE':'Choose your answer privately';if(selected==='court')role=localStep===localAccused?'YOU ARE ACCUSED — defend yourself':'You are a juror';s+=card('PRIVATE ROLE: '+who,role);if(selected==='liar')s+=panel(esc(localPrompt));if(selected==='cards'&&localStep!==localJudge){localOffered=shuffle(bank).slice(0,4);s+=localOffered.map(x=>'<button class="choice" data-localchoice="'+esc(x)+'">'+esc(x)+'</button>').join('')}if(selected==='confessions')s+='<textarea id="localtext" placeholder="Write your true anonymous confession here"></textarea>';if(['cards','confessions'].includes(selected)&&!(selected==='cards'&&localStep===localJudge))s+=button('Save & Hide','localSubmit','full');else s+=button('Hide & Next Player','localNext','full')}
if(localPhase==='discussion'){s+=card('GAME MASTER — READ ALOUD',selected==='impostor'?'Everyone gives a short clue. Discuss who does not know the word.':localPrompt);s+=panel('🗣️ Everyone talks out loud. The game master leads the discussion, then passes the phone for secret voting.');s+=button(selected==='cards'?'Judge Answers':'Start Voting','localVoteStart','full')}
if(localPhase==='vote'){const who=localPlayers[localStep];s+=card('PRIVATE VOTE','Pass to '+who+'. Who gets your vote?');let opts=selected==='court'?['Not guilty','Guilty']:localPlayers;s+=opts.map((v,i)=>'<button class="choice" data-localvote="'+i+'">'+esc(v)+'</button>').join('')}
if(localPhase==='judge'){s+=card('JUDGE: '+localPlayers[localJudge],localPrompt);s+=shuffle(localSubmissions).map(x=>'<button class="choice" data-localwinner="'+esc(x.player)+'">'+esc(x.answer)+'</button>').join('')}
if(localPhase==='results'){let result='';if(['liar','impostor'].includes(selected)){result='The '+(selected==='liar'?'LIAR':'IMPOSTOR')+' was '+localPlayers[localSecret]+'!';const count=localVotes.filter(v=>v===localSecret).length;localVotes.forEach((v,i)=>{if(v===localSecret&&i!==localSecret)localScores[localPlayers[i]]+=2});if(count<=Math.floor((localPlayers.length-1)/2))localScores[localPlayers[localSecret]]+=3}else if(selected==='exposed'){const winner=localPlayers[localVotes.sort((a,b)=>localVotes.filter(x=>x===b).length-localVotes.filter(x=>x===a).length)[0]];result='Most exposed: '+winner;localScores[winner]+=1}else if(selected==='court'){const guilty=localVotes.filter(x=>x===1).length;result=guilty>localVotes.length/2?'GUILTY!':'NOT GUILTY!';if(guilty<=localVotes.length/2)localScores[localPlayers[localAccused]]+=2}else if(selected==='confessions'){result='Who wrote these confessions?';}else result='Winner selected!';s+=card('THE REVEAL ✨',result);if(selected==='impostor')s+=panel('Secret word: '+esc(localPrompt));if(selected==='confessions')s+=panel(shuffle(localSubmissions).map(x=>'<p><b>'+esc(x.answer)+'</b> — '+esc(localPlayers[x.player])+'</p>').join(''));s+=panel(localPlayers.map(x=>'<div class="score">'+esc(x)+' <b>'+localScores[x]+' pts</b></div>').join(''));s+=button('Play another round','localAgain','full')}
page(s)}
let localChoice='';
document.addEventListener('click',e=>{const button=e.target.closest('[data-action],[data-mode],[data-localmode],[data-choice],[data-judge],[data-localchoice],[data-localvote],[data-localwinner]');if(!button)return;
if(button.dataset.mode){selected=button.dataset.mode;socket.send(JSON.stringify({type:'mode',mode:selected}));return}
if(button.dataset.localmode){selected=button.dataset.localmode;localStart();return}
if(button.dataset.choice!==undefined){document.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('active'));button.classList.add('active');localChoice=button.dataset.choice;return}
if(button.dataset.judge){socket.send(JSON.stringify({type:'judge',index:Number(button.dataset.judge)}));return}
if(button.dataset.localchoice){localChoice=button.dataset.localchoice;document.querySelectorAll('[data-localchoice]').forEach(x=>x.classList.toggle('active',x===button));return}
if(button.dataset.localvote){localVotes.push(Number(button.dataset.localvote));localStep++;if(localStep>=localPlayers.length){localPhase='results'}else localPhase='vote';localRender();return}
if(button.dataset.localwinner){localScores[localPlayers[Number(button.dataset.localwinner)]]+=2;localPhase='results';localRender();return}
const a=button.dataset.action;
if(a==='home'){localMode=false;state=null;home()}if(a==='reload')location.reload();if(a==='localSetup'){localMode=true;localSetup()}if(a==='localSave'){localPlayers=[...new Set(document.getElementById('names').value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean))].slice(0,20);if(localPlayers.length<3)return alert('Enter at least 3 names');localScores=Object.fromEntries(localPlayers.map(x=>[x,0]));localRound=0;localChoose()}
if(a==='newRoom')credentials('create');if(a==='joinRoom')credentials('join');if(a==='connectcreate'||a==='connectjoin'){name=document.getElementById('nickname').value.trim();if(!name)return alert('Enter a nickname');const room=a==='connectjoin'?document.getElementById('roomcode').value.trim().toUpperCase():'';connect();socket.onopen=()=>socket.send(JSON.stringify({type:a==='connectcreate'?'create':'join',name,code:room}));page(panel('Connecting to party room...'))}
if(a==='copy'){navigator.clipboard?.writeText(location.origin+' — Room code: '+state.code);alert('Invite copied')}
if(a==='start'){privateData=null;socket.send(JSON.stringify({type:'start'}))}
if(a==='submitText'){const value=document.getElementById('confession')?.value.trim();if(!value)return alert('Write your confession');socket.send(JSON.stringify({type:'submit',value}));document.getElementById('sent').textContent='Submitted. Wait for friends!';document.querySelector('textarea').disabled=true}
if(a==='submit'){if(!localChoice)return alert('Choose an answer');socket.send(JSON.stringify({type:'submit',value:localChoice}));document.getElementById('sent').textContent='Answer locked!';document.querySelectorAll('.choice').forEach(x=>x.disabled=true);localChoice=''}
if(a==='localReveal'){localPhase='reveal';localRender()}if(a==='localNext'){localStep++;if(localStep>=localPlayers.length){localPhase='discussion'}else localPhase='pass';localRender()}
if(a==='localSubmit'){const value=selected==='cards'?localChoice:document.getElementById('localtext')?.value.trim();if(!value)return alert('Please choose or enter an answer');localSubmissions.push({player:localStep,answer:value});localChoice='';localStep++;if(localStep>=localPlayers.length){localPhase='discussion'}else localPhase='pass';localRender()}
if(a==='localVoteStart'){if(selected==='cards'){localPhase='judge'}else if(selected==='confessions'){localPhase='results'}else{localStep=0;localPhase='vote'}localRender()}if(a==='localAgain')localStart();if(a==='scores'){page(menu()+panel((localMode?localPlayers.map(x=>({name:x,score:localScores[x]})):state?.players||[]).sort((a,b)=>b.score-a.score).map(p=>'<div class="score">'+esc(p.name)+' <b>'+p.score+' pts</b></div>').join(''))+button('Back','back','full'))}if(a==='back'){if(localMode)localRender();else render()}
});home();
</script></html>
